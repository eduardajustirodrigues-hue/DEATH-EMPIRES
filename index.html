<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#0b0e12">
  <title>DEATH-EMPIRES — 3D Kingdom</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="loading"><div class="loader-ring"></div><strong>DEATH-EMPIRES</strong><span>Carregando reino...</span></div>
  <div id="game">
    <div id="hud">
      <div class="top-row">
        <div class="kingdom">
          <div class="crest">♜</div>
          <div><b>Fortaleza de Aurora</b><small>Reino do Norte · Lv. 1</small></div>
        </div>
        <div class="resources">
          <div>🪵 <b id="wood">1.200</b></div>
          <div>🌾 <b id="food">1.000</b></div>
          <div>🪨 <b id="stone">700</b></div>
          <div>⛓️ <b id="iron">400</b></div>
          <div>🪙 <b id="gold">250</b></div>
        </div>
      </div>

      <div class="quick-actions">
        <button data-action="mail">✉️<span>Correio</span></button>
        <button data-action="quests">📜<span>Missões</span></button>
        <button data-action="alliance">🛡️<span>Aliança</span></button>
        <button data-action="settings">⚙️<span>Menu</span></button>
      </div>

      <div class="bottom-panel">
        <div class="selection">
          <div class="selection-icon">🏰</div>
          <div><strong id="selectionTitle">Fortaleza de Aurora</strong><small id="selectionText">Toque em uma construção para interagir.</small></div>
        </div>
        <div class="bottom-actions">
          <button id="cityBtn">🏰 Cidade</button>
          <button id="armyBtn">⚔️ Exército</button>
          <button id="mapBtn">🌎 Mundo</button>
        </div>
      </div>
    </div>

    <div id="crosshair">+</div>
    <div id="toast"></div>
    <div id="modal" class="hidden">
      <div class="modal-card">
        <button id="closeModal">✕</button>
        <div id="modalContent"></div>
      </div>
    </div>
    <div id="controls-hint">Arraste para girar · Pinça para zoom · Toque nas construções</div>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
